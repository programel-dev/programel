server {
    listen 443 ssl;
    server_name test.programel.com test.programel.local;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    resolver 127.0.0.11 valid=10s;

    location ~ ^/api/(v\d+|health|docs) {
        set $staging_api api-staging:9001;
        fastcgi_pass $staging_api;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    location / {
        set $staging_frontend frontend-staging:3001;
        proxy_pass http://$staging_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name test.programel.com test.programel.local;
    return 301 https://$host$request_uri;
}
