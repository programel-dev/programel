upstream nextjs {
    server frontend:3000;
}

upstream php-fpm {
    server api:9000;
}

server {
    listen 443 ssl;
    server_name programel.com;

    ssl_certificate /etc/letsencrypt/live/programel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/programel.com/privkey.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP for frontend
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.sentry.io; font-src 'self' data:; frame-ancestors 'none';" always;

    # API endpoints → PHP-FPM
    location ~ ^/api/(v\d+|health|docs) {
        fastcgi_pass php-fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # Next.js static assets
    location /_next/static {
        proxy_pass http://nextjs;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Everything else → Next.js SSR
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name programel.com;
    return 301 https://$host$request_uri;
}
