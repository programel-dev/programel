server {
    listen 443 ssl;
    server_name olcha.programel.com;

    ssl_certificate /etc/letsencrypt/live/programel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/programel.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/static/olcha;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name olcha.programel.com;
    return 301 https://$host$request_uri;
}
