services:
  api-staging:
    image: ${DOCKER_REGISTRY}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-staging:5432/programel_staging?serverVersion=16
      REDIS_URL: redis://redis-staging:6379
      LOCK_DSN: redis://redis-staging:6379
      MAILER_DSN: ${MAILER_DSN}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      SENTRY_DSN: ${SENTRY_DSN}
      APP_SECRET: ${APP_SECRET}
      EQUEUE_TARGET_URL: ${EQUEUE_TARGET_URL:-https://munich.pasport.org.ua/solutions/e-queue}
      EQUEUE_POLL_INTERVAL: ${EQUEUE_POLL_INTERVAL:-300}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr-staging:8191/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy

  worker-staging:
    image: ${DOCKER_REGISTRY}/api:${IMAGE_TAG:-latest}
    command: bin/console messenger:consume async scheduler_default --memory-limit=128M --time-limit=3600
    restart: unless-stopped
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-staging:5432/programel_staging?serverVersion=16
      REDIS_URL: redis://redis-staging:6379
      LOCK_DSN: redis://redis-staging:6379
      MAILER_DSN: ${MAILER_DSN}
      SENTRY_DSN: ${SENTRY_DSN}
      APP_SECRET: ${APP_SECRET}
      EQUEUE_TARGET_URL: ${EQUEUE_TARGET_URL:-https://munich.pasport.org.ua/solutions/e-queue}
      EQUEUE_POLL_INTERVAL: ${EQUEUE_POLL_INTERVAL:-300}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr-staging:8191/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    depends_on:
      api-staging:
        condition: service_started
      flaresolverr-staging:
        condition: service_healthy

  frontend-staging:
    image: ${DOCKER_REGISTRY}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api-staging:9001
      NEXT_PUBLIC_API_URL: /api/v1
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "3001:3000"

  postgres-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: programel_staging
    volumes:
      - pg_data_staging:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-staging:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  flaresolverr-staging:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Europe/Kyiv
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pg_data_staging:
