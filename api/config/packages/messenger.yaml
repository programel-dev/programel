framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(REDIS_URL)%/messages?read_timeout=5'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 4
                    max_delay: 60000
            failed:
                dsn: '%env(REDIS_URL)%/messages_failed'

        routing:
            'App\DocumentCenter\Application\*': async
            'App\Telegram\Infrastructure\SendTelegramMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
