framework:
    http_client:
        scoped_clients:
            equeue.client:
                base_uri: '%env(EQUEUE_TARGET_URL)%'
                timeout: 10
                max_duration: 15
                headers:
                    User-Agent: '%env(EQUEUE_USER_AGENT)%'
                    Accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                    Accept-Language: 'uk-UA,uk;q=0.9,en;q=0.8'

            telegram.client:
                base_uri: 'https://api.telegram.org/bot%env(TELEGRAM_BOT_TOKEN)%/'
                timeout: 10
                max_duration: 15
                headers:
                    Accept: 'application/json'
