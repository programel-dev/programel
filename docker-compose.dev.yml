services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    volumes:
      - ./api:/app
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LOCK_DSN: ${REDIS_URL}
      MAILER_DSN: smtp://mailpit:1025
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      SENTRY_DSN: ""
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      EQUEUE_TARGET_URL: ${EQUEUE_TARGET_URL:-https://munich.pasport.org.ua/solutions/e-queue}
      EQUEUE_POLL_INTERVAL: ${EQUEUE_POLL_INTERVAL:-300}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    command: bin/console messenger:consume async scheduler_default --memory-limit=128M -vv
    volumes:
      - ./api:/app
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LOCK_DSN: ${REDIS_URL}
      MAILER_DSN: smtp://mailpit:1025
      SENTRY_DSN: ""
      EQUEUE_TARGET_URL: ${EQUEUE_TARGET_URL:-https://munich.pasport.org.ua/solutions/e-queue}
      EQUEUE_POLL_INTERVAL: ${EQUEUE_POLL_INTERVAL:-300}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191/v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      api:
        condition: service_started
      flaresolverr:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_INTERNAL_URL: http://nginx
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3001:3000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl/dev:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Europe/Kyiv
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  pg_data_dev:
