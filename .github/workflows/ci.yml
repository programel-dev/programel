name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, zip, pdo_pgsql, redis
          tools: composer, cs2pr

      - name: Create API .env
        working-directory: api
        run: |
          echo "APP_ENV=dev" > .env
          echo "APP_SECRET=ci-secret" >> .env
          echo "DATABASE_URL=postgresql://localhost:5432/programel?serverVersion=16" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "MAILER_DSN=null://null" >> .env
          echo "JWT_PASSPHRASE=ci-passphrase" >> .env
          echo "SENTRY_DSN=" >> .env

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-progress --prefer-dist

      - name: PHP CS Fixer
        working-directory: api
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --format=checkstyle | cs2pr
        continue-on-error: true

      - name: PHPStan
        working-directory: api
        run: vendor/bin/phpstan analyse --no-progress
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: programel
          POSTGRES_PASSWORD: programel
          POSTGRES_DB: programel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, zip
          tools: composer

      - name: Create API .env
        working-directory: api
        run: |
          echo "APP_ENV=test" > .env
          echo "APP_SECRET=test-secret" >> .env
          echo "DATABASE_URL=postgresql://programel:programel@localhost:5432/programel_test?serverVersion=16" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "MAILER_DSN=null://null" >> .env
          echo "JWT_PASSPHRASE=test-passphrase" >> .env
          echo "SENTRY_DSN=" >> .env

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-progress --prefer-dist

      - name: Run PHPUnit
        working-directory: api
        env:
          APP_ENV: test
        run: bin/phpunit
        continue-on-error: true

      - name: Run Behat
        working-directory: api
        env:
          APP_ENV: test
        run: vendor/bin/behat --no-interaction
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/programel
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml exec -T api bin/console doctrine:migrations:migrate --no-interaction || true
            docker compose -f docker-compose.prod.yml up -d
            echo "$(date -Iseconds) ${{ github.sha }}" >> .deploy-history
